name: Portfolio checks

on:
  push:
    branches: [feature/image-crop-tool]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install chromium
      - run: npm run test:browser
